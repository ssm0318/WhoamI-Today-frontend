# Reverse proxy config for whoami-test-group.gina-park.site
#
# 이 파일은 원래 서버의 /home/ubuntu/nginx_conf/*.conf 를 repo로 옮겨온 것.
# 변경된 부분:
#   - HTTP(80) /static/ 의 `proxy_pass http://whoami-frontend:80;` 제거.
#     기존엔 별도 whoami-frontend 컨테이너로 프록시했지만, 새 구조에서는
#     단일 nginx 컨테이너가 정적 파일을 직접 서빙하므로 alias로 통합.
#   - 그 외 directive는 원본과 동일하게 유지.

# HTTP 요청 처리 (80 포트)
server {
    listen 80;
    server_name whoami-test-group.gina-park.site;

    # 사진 업로드 용량 제한
    client_max_body_size 15M;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        try_files $uri $uri/ =404;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/adoorback/adoorback/adoorback/media/;  # Django의 MEDIA_ROOT 경로
        autoindex on;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS 요청 처리 (443 포트)
server {
    listen 443 ssl;
    server_name whoami-test-group.gina-park.site;

    # 사진 업로드 용량 제한
    client_max_body_size 15M;

    # SSL 인증서 경로 설정
    ssl_certificate /etc/letsencrypt/live/whoami-test-group.gina-park.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoami-test-group.gina-park.site/privkey.pem;

    # 보안 옵션
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 프론트엔드 정적 파일 처리 (직접 서빙)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        try_files $uri $uri/ =404;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/adoorback/adoorback/adoorback/media/;  # Django의 MEDIA_ROOT 경로
        autoindex on;
        access_log off;
    }

    # 프론트엔드 라우팅 처리 (SPA 지원)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # API 요청 처리
    location /api/ {
        proxy_pass http://whoami-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 프록시
    location /ws/ {
        proxy_pass http://whoami-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 404 처리 (SPA 라우팅 지원)
    error_page 404 /index.html;
}
