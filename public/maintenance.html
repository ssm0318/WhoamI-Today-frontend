<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoAmI Today - 점검중</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FFFFFF;
            color: #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #8700FF;
            margin-bottom: 12px;
        }

        .message {
            font-size: 16px;
            font-weight: 400;
            color: #666666;
            line-height: 1.6;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: #8700FF;
            border-radius: 2px;
            margin: 24px auto;
        }

        .sub-message {
            font-size: 13px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <div class="title">WhoAmI Today</div>
        <p class="message">
            서비스 점검중입니다.<br>
            더 나은 서비스로 돌아오겠습니다.
        </p>
        <div class="divider"></div>
        <p class="sub-message">We're currently under maintenance.<br>We'll be back soon with improvements.</p>
    </div>
</body>
</html>
