name: Deploy to New Production Server

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: yarn install

    - name: Create key.ts from secrets
      run: |
        echo "export const SPOTIFY_CLIENT_ID = '${{ secrets.SPOTIFY_CLIENT_ID }}';" > src/key.ts
        echo "export const SPOTIFY_CLIENT_SECRET = '${{ secrets.SPOTIFY_CLIENT_SECRET }}';" >> src/key.ts
        
    - name: Connect to EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.NEW_SERVER_HOST }}
        username: ${{ secrets.NEW_SERVER_USER }}
        key: ${{ secrets.NEW_SERVER_KEY }}
        script: |
          set -e

          echo "🚀 선택한 브랜치(${{ github.ref_name }})로 강제 checkout"
          cd ~/WhoamI-Today-frontend
          git fetch --all --prune
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          echo "📂 frontend_build_volume 존재 확인 (없으면 생성)"
          docker volume inspect frontend_build_volume >/dev/null 2>&1 \
            || docker volume create frontend_build_volume

          echo "🧹 디스크 정리 (volume은 보존)"
          docker builder prune -af || true
          docker image prune -f --filter "until=24h" || true
          docker container prune -f || true
          df -h / | tail -1

          echo "🏗  새 이미지 빌드 (nginx는 계속 동작 중 — 다운타임 없음)"
          docker compose -f docker-compose.production.yml build frontend-builder

          echo "💾 현재 빌드 백업 (롤백용)"
          BACKUP_DIR="/tmp/frontend_backup_$(date +%Y%m%d_%H%M%S)"
          docker run --rm -v frontend_build_volume:/src -v /tmp:/backup alpine \
            sh -c "mkdir -p /backup/$(basename $BACKUP_DIR) && cp -a /src/. /backup/$(basename $BACKUP_DIR)/" || echo "⚠️ 백업 실패 (첫 배포일 수 있음)"

          echo "🔄 빌드 결과 볼륨에 복사 (builder만 실행)"
          docker compose -f docker-compose.production.yml run --rm frontend-builder

          echo "♻️  nginx에 새 빌드 반영 (reload로 무중단)"
          docker compose -f docker-compose.production.yml exec nginx-reverse-proxy nginx -s reload 2>/dev/null || {
            echo "nginx reload 실패 — 컨테이너 재시작으로 대체"
            docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate nginx-reverse-proxy
          }

          echo "🧪 헬스체크 (bypass 쿠키로 maintenance 모드 우회)"
          sleep 3
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -b 'maintenance_bypass=whoami2026_v18_go' https://whoami-test-group.gina-park.site/ 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ 배포 완료! (HTTP $HTTP_STATUS)"
            docker run --rm -v /tmp:/tmp alpine rm -rf "/tmp/$(basename $BACKUP_DIR)" 2>/dev/null || true
          else
            echo "❌ 헬스체크 실패 (HTTP $HTTP_STATUS) — 롤백 시작"
            if [ -d "$BACKUP_DIR" ]; then
              docker run --rm -v frontend_build_volume:/dst -v /tmp:/backup alpine \
                sh -c "rm -rf /dst/* /dst/.[!.]* 2>/dev/null; cp -a /backup/$(basename $BACKUP_DIR)/. /dst/"
              docker compose -f docker-compose.production.yml exec nginx-reverse-proxy nginx -s reload 2>/dev/null || \
                docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate nginx-reverse-proxy
              echo "🔄 롤백 완료 (이전 빌드로 복구)"
              docker run --rm -v /tmp:/tmp alpine rm -rf "/tmp/$(basename $BACKUP_DIR)" 2>/dev/null || true
            fi
            exit 1
          fi
