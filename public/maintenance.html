<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoAmI Today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FFFFFF;
            color: #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            margin-bottom: 24px;
        }

        .logo svg {
            width: 80px;
            height: 80px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #8700FF;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .message {
            font-size: 16px;
            font-weight: 400;
            color: #333333;
            line-height: 1.7;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: #8700FF;
            border-radius: 2px;
            margin: 24px auto;
        }

        .sub-message {
            font-size: 13px;
            color: #999999;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14" cy="14" r="14" fill="black"/>
                <g clip-path="url(#clip0)">
                    <path d="M17.5628 10.6929H19.2732V22.0001H15.5156V12.74C15.5156 11.6103 16.4331 10.6929 17.5628 10.6929Z" fill="#8700FF"/>
                    <path d="M9.87906 9.75273C10.9168 9.75273 11.7581 8.91265 11.7581 7.87636C11.7581 6.84008 10.9168 6 9.87906 6C8.84128 6 8 6.84008 8 7.87636C8 8.91265 8.84128 9.75273 9.87906 9.75273Z" fill="#87DFFF"/>
                    <path d="M11.7576 10.6929H8V22.0001H11.7576V10.6929Z" fill="#87DFFF"/>
                    <path d="M13.6366 9.75273C14.6744 9.75273 15.5157 8.91265 15.5157 7.87636C15.5157 6.84008 14.6744 6 13.6366 6C12.5989 6 11.7576 6.84008 11.7576 7.87636C11.7576 8.91265 12.5989 9.75273 13.6366 9.75273Z" fill="#87DFFF"/>
                    <path d="M15.5151 10.6929H11.7576V22.0001H15.5151V10.6929Z" fill="#87DFFF"/>
                    <path d="M17.3947 9.77081C18.4325 9.77081 19.2737 8.92953 19.2737 7.89175C19.2737 6.85398 18.4325 6.0127 17.3947 6.0127C16.3569 6.0127 15.5156 6.85398 15.5156 7.89175C15.5156 8.92953 16.3569 9.77081 17.3947 9.77081Z" fill="#8700FF"/>
                </g>
                <defs>
                    <clipPath id="clip0">
                        <rect width="11.2733" height="16" fill="white" transform="translate(8 6)"/>
                    </clipPath>
                </defs>
            </svg>
        </div>
        <div class="title">WhoAmI Today</div>
        <div class="emoji" id="emoji"></div>
        <p class="message" id="message"></p>
        <div class="divider"></div>
        <p class="sub-message" id="sub-message"></p>
    </div>
    <script>
        var isKo = (navigator.language || '').startsWith('ko');
        document.getElementById('emoji').textContent = isKo ? '\uD83D\uDE2E\u200D\uD83D\uDCA8' : '\uD83E\uDE9E\u2728';
        document.getElementById('message').innerHTML = isKo
            ? '잠깐 심호흡 중이에요<br>금방 새로워진 모습으로 돌아올게요!'
            : 'Excuse us —<br>we\'re getting a little glow-up!';
        document.getElementById('sub-message').textContent = isKo
            ? '5분 후에 다시 접속해 주세요'
            : 'Please come back in 5 minutes';
        document.documentElement.lang = isKo ? 'ko' : 'en';

        // 30초마다 서버 상태 확인, 복구되면 자동으로 앱으로 이동
        setInterval(function() {
            fetch('/api/health/').then(function(r) {
                if (r.ok) window.location.replace('/');
            }).catch(function() {});
        }, 10000);
    </script>
</body>
</html>
