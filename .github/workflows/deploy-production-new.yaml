name: Deploy to New Production Server

on:
  push:
    branches:
      - release/final-research
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: yarn install

    - name: Create key.ts from secrets
      run: |
        echo "export const SPOTIFY_CLIENT_ID = '${{ secrets.SPOTIFY_CLIENT_ID }}';" > src/key.ts
        echo "export const SPOTIFY_CLIENT_SECRET = '${{ secrets.SPOTIFY_CLIENT_SECRET }}';" >> src/key.ts
        
    - name: Connect to EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.NEW_SERVER_HOST }}
        username: ${{ secrets.NEW_SERVER_USER }}
        key: ${{ secrets.NEW_SERVER_KEY }}
        script: |
          set -e

          echo "🚀 선택한 브랜치(${{ github.ref_name }})로 강제 checkout"
          cd ~/WhoamI-Today-frontend
          git fetch --all --prune
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          echo "📂 frontend_build_volume 존재 확인 (없으면 생성)"
          docker volume inspect frontend_build_volume >/dev/null 2>&1 \
            || docker volume create frontend_build_volume

          echo "🛑 기존 컨테이너 종료"
          docker compose -f docker-compose.production.yml down

          echo "🧹 Legacy 컨테이너 정리 (compose 바깥에서 떠 있던 것들)"
          docker rm -f nginx-reverse-proxy 2>/dev/null || true
          docker rm -f whoami-frontend 2>/dev/null || true

          echo "🔄 컨테이너 재배포 (Build & Run)"
          docker compose -f docker-compose.production.yml up --build -d

          echo "✅ 배포 완료!"